{% extends "base.html" %}
{% set current_page = "manage" %}

{% block title %}管理 — MLOps Dashboard{% endblock %}

{% block content %}
<div class="space-y-10">

  <!-- ========== プロジェクト管理 ========== -->
  <section>
    <h2 class="text-base font-semibold text-white mb-5 flex items-center gap-2 pb-3 border-b border-gray-800">
      <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
      </svg>
      プロジェクト管理
    </h2>
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">

      <!-- 登録フォーム -->
      <div class="bg-gray-900 border border-gray-800 rounded-xl p-5">
        <h3 class="text-sm font-medium text-gray-300 mb-4">新規登録</h3>
        <form id="project-create-form" onsubmit="handleProjectCreate(event)" class="space-y-3">
          <div>
            <label class="block text-xs text-gray-400 mb-1">
              プロジェクト名 <span class="text-red-400">*</span>
            </label>
            <input type="text" name="project_name" required maxlength="100"
              class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 placeholder-gray-600"
              placeholder="例: fraud-detection">
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">説明</label>
            <textarea name="description" maxlength="500" rows="2"
              class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 resize-none placeholder-gray-600"
              placeholder="任意"></textarea>
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">
              タスク種別 <span class="text-red-400">*</span>
            </label>
            <select name="task_type"
              class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
              <option value="binary">二値分類</option>
              <option value="multi-class">多クラス分類</option>
              <option value="multi-label">多ラベル分類</option>
              <option value="regression">回帰</option>
            </select>
          </div>
          <div class="flex items-center gap-3 pt-1">
            <button type="submit"
              class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">
              登録
            </button>
            <p id="project-create-msg" class="text-xs"></p>
          </div>
        </form>
      </div>

      <!-- プロジェクト一覧（htmx） -->
      <div class="lg:col-span-3"
        id="project-list"
        hx-get="./ui/project-list"
        hx-trigger="load">
        <div class="flex items-center gap-2 text-gray-500 text-sm p-4">
          <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
          </svg>
          読み込み中…
        </div>
      </div>
    </div>
  </section>

  <!-- ========== 推論ログ管理 ========== -->
  <section>
    <h2 class="text-base font-semibold text-white mb-5 flex items-center gap-2 pb-3 border-b border-gray-800">
      <svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
      </svg>
      推論ログ管理
    </h2>

    <!-- フィルタ -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 mb-4">
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 items-end">
        <div>
          <label class="block text-xs text-gray-400 mb-1">
            プロジェクト <span class="text-red-400">*</span>
          </label>
          <select id="log-project-select"
            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
            {% if projects %}
              {% for p in projects %}
              <option value="{{ p.project_id }}">{{ p.project_name }}</option>
              {% endfor %}
            {% else %}
              <option value="">（プロジェクトなし）</option>
            {% endif %}
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">開始日時 (UTC)</label>
          <input type="datetime-local" id="log-from-dt"
            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">終了日時 (UTC)</label>
          <input type="datetime-local" id="log-to-dt"
            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">リクエスト ID</label>
          <input type="text" id="log-request-id" placeholder="部分一致"
            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 placeholder-gray-600">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">エラーフラグ</label>
          <select id="log-is-error"
            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
            <option value="">全て</option>
            <option value="true">エラーのみ</option>
            <option value="false">正常のみ</option>
          </select>
        </div>
      </div>
      <div class="flex items-center gap-3 mt-4">
        <button onclick="searchLogs(1)"
          class="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          検索
        </button>
        <span class="text-xs text-gray-600 htmx-indicator" id="log-loading">
          <svg class="w-4 h-4 animate-spin inline" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
          </svg>
          読み込み中…
        </span>
      </div>
    </div>

    <!-- ログ一覧 -->
    <div id="log-list">
      <p class="text-gray-600 text-sm text-center py-10 bg-gray-900/50 border border-gray-800 rounded-xl">
        条件を設定して「検索」を押してください
      </p>
    </div>
  </section>

</div>
{% endblock %}

{% block scripts %}
<script>
  async function handleProjectCreate(event) {
    event.preventDefault();
    const form = event.target;
    const data = Object.fromEntries(new FormData(form));
    const msgEl = document.getElementById('project-create-msg');
    try {
      const resp = await fetch('./api/projects', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      if (resp.ok) {
        const project = await resp.json();
        msgEl.textContent = '登録しました';
        msgEl.className = 'text-xs text-emerald-400';
        form.reset();
        htmx.ajax('GET', './ui/project-list', { target: '#project-list' });
        _addProjectOption(project);
        setTimeout(() => { msgEl.textContent = ''; }, 3000);
      } else {
        const err = await resp.json();
        msgEl.textContent = 'エラー: ' + (err.detail || resp.status);
        msgEl.className = 'text-xs text-red-400';
      }
    } catch (e) {
      msgEl.textContent = '通信エラー';
      msgEl.className = 'text-xs text-red-400';
    }
  }

  function _addProjectOption(project) {
    const select = document.getElementById('log-project-select');
    const placeholder = select.querySelector('option[value=""]');
    if (placeholder) placeholder.remove();
    const opt = document.createElement('option');
    opt.value = project.project_id;
    opt.textContent = project.project_name;
    select.appendChild(opt);
  }

  async function deleteProject(projectId, projectName) {
    if (!confirm(`「${projectName}」を削除しますか？\n\n関連するすべての推論ログも削除されます。`)) return;
    const resp = await fetch('./api/projects/' + projectId, { method: 'DELETE' });
    if (resp.ok) {
      htmx.ajax('GET', './ui/project-list', { target: '#project-list' });
      const select = document.getElementById('log-project-select');
      const opt = select.querySelector(`option[value="${projectId}"]`);
      if (opt) opt.remove();
      if (select.options.length === 0) {
        const ph = document.createElement('option');
        ph.value = '';
        ph.textContent = '（プロジェクトなし）';
        select.appendChild(ph);
      }
      document.getElementById('log-list').innerHTML =
        '<p class="text-gray-600 text-sm text-center py-10 bg-gray-900/50 border border-gray-800 rounded-xl">条件を設定して「検索」を押してください</p>';
    } else {
      alert('削除に失敗しました');
    }
  }

  function searchLogs(page) {
    const projectId = document.getElementById('log-project-select').value;
    if (!projectId) { alert('プロジェクトを選択してください'); return; }
    const params = new URLSearchParams({ project_id: projectId, page: page || 1 });
    const fromDt = document.getElementById('log-from-dt').value;
    const toDt   = document.getElementById('log-to-dt').value;
    const reqId  = document.getElementById('log-request-id').value.trim();
    const isErr  = document.getElementById('log-is-error').value;
    if (fromDt) params.set('from_dt', fromDt);
    if (toDt)   params.set('to_dt', toDt);
    if (reqId)  params.set('request_id_filter', reqId);
    if (isErr)  params.set('is_error', isErr);
    htmx.ajax('GET', './ui/log-list?' + params.toString(), {
      target: '#log-list',
      indicator: '#log-loading',
    });
  }

  async function deleteLog(logId) {
    if (!confirm('このログ（ID: ' + logId + '）を削除しますか？')) return;
    const projectId = document.getElementById('log-project-select').value;
    const url = './api/logs/' + logId + (projectId ? '?project_id=' + encodeURIComponent(projectId) : '');
    const resp = await fetch(url, { method: 'DELETE' });
    if (resp.ok) {
      document.getElementById('log-row-' + logId)?.remove();
    } else {
      alert('削除に失敗しました');
    }
  }

  async function deleteSelectedLogs() {
    const checked = [...document.querySelectorAll('.log-checkbox:checked')].map(el => el.value);
    if (!checked.length) { alert('削除するログを選択してください'); return; }
    if (!confirm(checked.length + ' 件のログを削除しますか？')) return;
    const projectId = document.getElementById('log-project-select').value;
    const resp = await fetch('./api/logs/bulk-delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ log_ids: checked, project_id: projectId || null }),
    });
    if (resp.ok) {
      checked.forEach(id => document.getElementById('log-row-' + id)?.remove());
    } else {
      alert('削除に失敗しました');
    }
  }

  function toggleAllLogs(master) {
    document.querySelectorAll('.log-checkbox').forEach(cb => cb.checked = master.checked);
  }
</script>
{% endblock %}
