<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MLOps Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/static/js/htmx.min.js"></script>
  <script src="/static/js/chart.umd.min.js"></script>
  <style>
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline-block; }
    .htmx-request.htmx-indicator { display: inline-block; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">

  <!-- ヘッダー -->
  <header class="bg-gray-900 border-b border-gray-800 px-6 py-4">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center gap-4">
      <div class="flex items-center gap-3">
        <svg class="w-7 h-7 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
        </svg>
        <h1 class="text-lg font-bold text-white tracking-wide">MLOps Dashboard</h1>
      </div>

      <!-- フィルターフォーム -->
      <form id="filter-form" class="flex flex-wrap items-center gap-3 ml-auto">
        {% if projects %}
        <label class="text-sm text-gray-400">プロジェクト</label>
        <select id="project-select" name="project_id"
          class="bg-gray-800 border border-gray-700 text-white text-sm rounded-lg px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500"
          onchange="loadPanels()">
          {% for p in projects %}
          <option value="{{ p.id }}">{{ p.name }}{% if p.task_type == 'classification' %} (分類){% else %} (回帰){% endif %}</option>
          {% endfor %}
        </select>

        <label class="text-sm text-gray-400">期間</label>
        <select id="hours-select" name="hours"
          class="bg-gray-800 border border-gray-700 text-white text-sm rounded-lg px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500"
          onchange="loadPanels()">
          <option value="1">直近 1 時間</option>
          <option value="6">直近 6 時間</option>
          <option value="24" selected>直近 24 時間</option>
          <option value="168">直近 7 日間</option>
        </select>

        <button type="button" onclick="loadPanels()"
          class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">
          <span id="refresh-icon">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
          </span>
          更新
        </button>
        {% else %}
        <span class="text-sm text-gray-500">プロジェクトがありません — <code class="text-indigo-300">POST /api/projects</code> で登録してください</span>
        {% endif %}

        <!-- 自動更新インジケーター -->
        <span class="text-xs text-gray-600 htmx-indicator" id="loading-indicator">
          <svg class="w-4 h-4 animate-spin inline" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
          </svg>
          読み込み中…
        </span>
      </form>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-7xl mx-auto px-6 py-6">
    {% if projects %}
    <!-- ダッシュボードパネル（htmx 自動更新） -->
    <div id="dashboard-content"
         hx-get="/ui/panels"
         hx-include="#filter-form"
         hx-trigger="load, every 30s"
         hx-indicator="#loading-indicator">
      <div class="flex items-center justify-center h-48 text-gray-500">
        <svg class="w-6 h-6 animate-spin mr-2" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
        </svg>
        データを読み込んでいます…
      </div>
    </div>
    {% else %}
    <div class="flex flex-col items-center justify-center h-64 text-center">
      <svg class="w-16 h-16 text-gray-700 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
      </svg>
      <p class="text-gray-400 text-lg mb-2">プロジェクトが登録されていません</p>
      <p class="text-gray-600 text-sm">まず <code class="bg-gray-800 px-2 py-0.5 rounded text-indigo-300">seed_data.py</code> を実行するか、API でプロジェクトを登録してください。</p>
    </div>
    {% endif %}
  </main>

  <!-- API ドキュメントリンク -->
  <footer class="fixed bottom-4 right-4">
    <a href="/docs" target="_blank"
      class="text-xs text-gray-600 hover:text-gray-400 transition-colors bg-gray-900 px-3 py-1.5 rounded-lg border border-gray-800">
      API Docs
    </a>
  </footer>

  <script>
    function loadPanels() {
      const projectId = document.getElementById('project-select')?.value;
      const hours = document.getElementById('hours-select')?.value ?? '24';
      if (!projectId) return;
      htmx.ajax('GET', '/ui/panels', {
        target: '#dashboard-content',
        indicator: '#loading-indicator',
        values: { project_id: projectId, hours: hours, days: 7, drift_window: 100 }
      });
    }

    // Chart.js 初期化（htmx スワップ後）
    document.addEventListener('htmx:afterSettle', initAllCharts);

    function initAllCharts() {
      initBarChart('latency-chart');
      initLineChart('accuracy-chart');
    }

    function initBarChart(id) {
      const el = document.getElementById(id);
      if (!el) return;
      const existing = Chart.getChart(el);
      if (existing) existing.destroy();
      const labels = JSON.parse(el.dataset.labels || '[]');
      const values = JSON.parse(el.dataset.values || '[]');
      new Chart(el, {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            label: '件数',
            data: values,
            backgroundColor: 'rgba(99, 102, 241, 0.7)',
            borderColor: 'rgba(99, 102, 241, 1)',
            borderWidth: 1,
            borderRadius: 3,
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#9ca3af', font: { size: 10 } }, grid: { color: '#1f2937' } },
            y: { ticks: { color: '#9ca3af' }, grid: { color: '#1f2937' } }
          }
        }
      });
    }

    function initLineChart(id) {
      const el = document.getElementById(id);
      if (!el) return;
      const existing = Chart.getChart(el);
      if (existing) existing.destroy();
      const labels = JSON.parse(el.dataset.labels || '[]');
      const values = JSON.parse(el.dataset.values || '[]');
      const metricName = el.dataset.metricName || '値';
      new Chart(el, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: metricName,
            data: values,
            borderColor: 'rgba(52, 211, 153, 1)',
            backgroundColor: 'rgba(52, 211, 153, 0.1)',
            borderWidth: 2,
            pointRadius: 4,
            pointBackgroundColor: 'rgba(52, 211, 153, 1)',
            fill: true,
            tension: 0.3,
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#9ca3af', font: { size: 11 } }, grid: { color: '#1f2937' } },
            y: { ticks: { color: '#9ca3af' }, grid: { color: '#1f2937' } }
          }
        }
      });
    }
  </script>
</body>
</html>
